<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Sudhir Singh — Cinema-Grade Anamorphic Viewfinder HUD: Optical telemetry, real-time command line terminal, live automation code card, and systems engineering profile.">
  <title>Sudhir Singh — Cinema-Grade Optical Viewfinder HUD</title>
  <desc>1280x720 cinema-grade telemetry HUD featuring camera optics, terminal command execution, live code writing card, flickering neon sign, and horizontal scanner sweep.</desc>

  <defs>
    <!-- Background & Palette Gradients -->
    <linearGradient id="vfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A11"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#080D18"/>
    </linearGradient>

    <linearGradient id="vfBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="vfNameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#C084FC;#38BDF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#C084FC;#38BDF8;#818CF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#38BDF8;#818CF8;#C084FC" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="vfScanLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="vfDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.75" fill="#38BDF8" fill-opacity="0.18"/>
    </pattern>

    <!-- Clip paths for scanner and banner -->
    <clipPath id="bannerClip">
      <rect x="1" y="1" width="1278" height="718" rx="20"/>
    </clipPath>

    <clipPath id="codeReveal">
      <rect x="0" y="0" width="460" height="260">
        <animate attributeName="height" from="0" to="260" dur="2s" begin="0.8s" fill="freeze"/>
      </rect>
    </clipPath>

    <style type="text/css"><![CDATA[
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      /* Telemetry Blinking & Sweep */
      .rec-blink { animation: recPulse 1.4s ease-in-out infinite; }
      @keyframes recPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.2; transform: scale(0.85); } }

      .scanner-beam { animation: scanCycle 5.5s linear infinite; }
      @keyframes scanCycle {
        0% { transform: translateY(-80px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(740px); opacity: 0; }
      }

      .caret-blink { animation: caretStep 0.9s steps(1) infinite; }
      @keyframes caretStep { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .neon-flicker { animation: neonGlow 3.5s ease-in-out infinite; }
      @keyframes neonGlow {
        0%, 100% { opacity: 0.95; }
        45% { opacity: 0.95; }
        46% { opacity: 0.25; }
        48% { opacity: 0.95; }
        72% { opacity: 0.95; }
        73% { opacity: 0.4; }
        74% { opacity: 0.95; }
      }

      /* Cycling Role Titles */
      .role-seq { opacity: 0; animation: roleRotate 12s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .r-1 { animation-delay: 0s; }
      .r-2 { animation-delay: 4s; }
      .r-3 { animation-delay: 8s; }
      @keyframes roleRotate {
        0% { opacity: 0; transform: translateY(6px); }
        5% { opacity: 1; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(0); }
        33% { opacity: 0; transform: translateY(-6px); }
        100% { opacity: 0; }
      }

      .reticle-spin { animation: reticleTurn 24s linear infinite; transform-origin: 1180px 140px; }
      @keyframes reticleTurn { 100% { transform: rotate(360deg); } }

      .floating-particle { animation: particleFloat 6s ease-in-out infinite; }
      @keyframes particleFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }

      @media (prefers-reduced-motion: reduce) {
        .rec-blink, .scanner-beam, .caret-blink, .neon-flicker, .role-seq, .reticle-spin, .floating-particle {
          animation: none;
        }
        .r-1 { opacity: 1; }
        .rec-blink { opacity: 1; }
        .neon-flicker { opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- ── 1. BACKGROUND & AMBIENT GLOWS ────────────────────────── -->
  <rect width="1280" height="720" rx="22" fill="url(#vfBg)"/>
  <rect width="1280" height="720" rx="22" fill="url(#vfDots)"/>
  
  <circle cx="260" cy="220" r="280" fill="url(#orbCyan)">
    <animate attributeName="r" values="280;320;280" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="500" r="320" fill="url(#orbViolet)">
    <animate attributeName="r" values="320;360;320" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Cinema Border with Gradient Accent -->
  <rect x="1" y="1" width="1278" height="718" rx="21" fill="none" stroke="url(#vfBorder)" stroke-width="1.6"/>
  <rect x="18" y="18" width="1244" height="684" rx="12" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- ── 2. CONTINUOUS SCANNER SWEEP (CLIPPED) ────────────────── -->
  <g clip-path="url(#bannerClip)">
    <g class="scanner-beam">
      <rect x="0" y="0" width="1280" height="70" fill="url(#vfScanLine)"/>
      <line x1="0" y1="70" x2="1280" y2="70" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.85"/>
    </g>
  </g>

  <!-- ── 3. VIEWFINDER RETICLES & CROP MARKS ──────────────────── -->
  <g stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round">
    <!-- Top-Left -->
    <path d="M 32 64 L 32 32 L 64 32" fill="none"/>
    <!-- Top-Right -->
    <path d="M 1216 32 L 1248 32 L 1248 64" fill="none"/>
    <!-- Bottom-Left -->
    <path d="M 32 656 L 32 688 L 64 688" fill="none"/>
    <!-- Bottom-Right -->
    <path d="M 1216 688 L 1248 688 L 1248 656" fill="none"/>
  </g>

  <!-- Center Framing Crosshair -->
  <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="0.8">
    <line x1="640" y1="340" x2="640" y2="352"/>
    <line x1="640" y1="368" x2="640" y2="380"/>
    <line x1="624" y1="360" x2="636" y2="360"/>
    <line x1="644" y1="360" x2="656" y2="360"/>
    <circle cx="640" cy="360" r="22" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-dasharray="3 4"/>
  </g>

  <!-- ── 4. OPTICAL TELEMETRY HUD HEADER ──────────────────────── -->
  <!-- Recording Beacon -->
  <g transform="translate(56, 52)">
    <circle class="rec-blink" cx="0" cy="0" r="5" fill="#EF4444"/>
    <text x="14" y="4" font-size="11.5" font-weight="700" fill="#EF4444" letter-spacing="1.6">REC</text>
    <text x="58" y="4" font-size="11" fill="#64748B" letter-spacing="1.2">[LIVE · 4K DCI · 23.976 FPS · CINEMA RAW]</text>
  </g>

  <!-- Camera Optical Calibration Parameters -->
  <g transform="translate(640, 52)" text-anchor="middle">
    <text x="0" y="4" font-size="11" fill="#94A3B8" letter-spacing="1.6">FOCAL 50mm · ƒ/1.4 · ISO 100 · SHUTTER 1/250s · 5600K</text>
  </g>

  <!-- Location Telemetry -->
  <g transform="translate(1224, 52)" text-anchor="end">
    <text x="0" y="4" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1.2">LAT 25.5941° N // LON 85.1376° E [BIHAR-IN]</text>
  </g>

  <!-- ── 5. LEFT COLUMN: IDENTITY & TERMINAL EXECUTION ────────── -->
  <!-- Shell Window Header -->
  <g transform="translate(56, 105)">
    <rect x="0" y="0" width="620" height="32" rx="8" fill="#0A0F1A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#EF4444"/>
    <circle cx="30" cy="16" r="4" fill="#F59E0B"/>
    <circle cx="44" cy="16" r="4" fill="#10B981"/>
    <text x="64" y="20" font-size="11.5" fill="#64748B">user@systems:~#</text>
    <text x="195" y="20" font-size="11.5" font-weight="700" fill="#38BDF8">./deploy-profile --production --truth=100%</text>
    <rect class="caret-blink" x="548" y="8" width="8" height="16" fill="#38BDF8"/>
  </g>

  <!-- Primary Identity Display -->
  <g transform="translate(56, 185)">
    <!-- Small Tag -->
    <text x="2" y="16" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="2.5">// PRINCIPAL DEVELOPER &amp; AUTOMATION ARCHITECT</text>
    
    <!-- Big Headline Name -->
    <text class="sans" x="0" y="82" font-size="64" font-weight="900" fill="url(#vfNameGrad)" letter-spacing="-1.5">SUDHIR SINGH</text>

    <!-- Cycling Role Sequence -->
    <g transform="translate(2, 126)">
      <text class="role-seq r-1" x="0" y="0" font-size="17" font-weight="700" fill="#38BDF8" letter-spacing="1.4">&gt;&gt; SYSTEMS ARCHITECT &amp; AUTOMATION SPECIALIST</text>
      <text class="role-seq r-2" x="0" y="0" font-size="17" font-weight="700" fill="#C084FC" letter-spacing="1.4">&gt;&gt; FULL-STACK DEVELOPER // CLOUD CI/CD PIPELINES</text>
      <text class="role-seq r-3" x="0" y="0" font-size="17" font-weight="700" fill="#10B981" letter-spacing="1.4">&gt;&gt; 100% REAL LIVE DATA · ZERO HARDCODED FICTION</text>
    </g>

    <!-- Summary Box -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="620" height="86" rx="10" fill="#0A0F1A" stroke="#1E293B" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="86" rx="2" fill="#38BDF8"/>
      <text x="20" y="28" font-size="12" fill="#94A3B8" letter-spacing="0.4">BCA Systems Student · Bihar, India · Building verifiable open-source engines</text>
      <text x="20" y="52" font-size="11.5" fill="#64748B">Specializing in local-first apps, automated health gates, and production pipelines.</text>
      <text x="20" y="74" font-size="11" font-weight="600" fill="#10B981">&gt; 3,047+ Lifetime Commits   |   77 Production Repositories   |   Verified Daily</text>
    </g>

    <!-- Interactive Pill Highlights -->
    <g transform="translate(0, 270)">
      <!-- Pill 1: Status -->
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#0C1525" stroke="#38BDF8" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#10B981"/>
      <text x="28" y="21" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">OPEN TO WORK</text>
      <text x="168" y="21" text-anchor="end" font-size="10" fill="#10B981">✓</text>

      <!-- Pill 2: Security -->
      <rect x="195" y="0" width="195" height="34" rx="8" fill="#0C1525" stroke="#818CF8" stroke-width="1"/>
      <text x="14" y="21" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">SECURITY: ZERO-LOG</text>
      <text x="182" y="21" text-anchor="end" font-size="10" fill="#818CF8">🛡️</text>

      <!-- Pill 3: Sync -->
      <rect x="405" y="0" width="215" height="34" rx="8" fill="#0C1525" stroke="#10B981" stroke-width="1"/>
      <text x="14" y="21" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">ENGINE: 100% REST v3</text>
      <text x="202" y="21" text-anchor="end" font-size="10" fill="#10B981">⚡</text>
    </g>
  </g>

  <!-- ── 6. RIGHT COLUMN: AUTOMATION CODE CARD & NEON SIGN ────── -->
  <!-- Live Code Writing Card -->
  <g transform="translate(720, 105)">
    <rect x="0" y="0" width="504" height="286" rx="12" fill="#080D18" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="504" height="30" rx="12" fill="#0B1322"/>
    <circle cx="16" cy="15" r="3.5" fill="#EF4444"/>
    <circle cx="28" cy="15" r="3.5" fill="#F59E0B"/>
    <circle cx="40" cy="15" r="3.5" fill="#10B981"/>
    <text x="60" y="19" font-size="10.5" fill="#64748B">pipeline-automation.ts — production</text>
    <text x="490" y="19" text-anchor="end" font-size="9.5" fill="#38BDF8">TypeScript</text>

    <!-- Code Lines inside Clip Reveal -->
    <g clip-path="url(#codeReveal)" transform="translate(18, 44)">
      <text x="0" y="18" font-size="11" fill="#818CF8"><tspan fill="#F472B6">async function</tspan> deployProfile(): <tspan fill="#38BDF8">Promise&lt;Status&gt;</tspan> {</text>
      <text x="0" y="40" font-size="11" fill="#64748B">&#160;&#160;// 1. Fetch real API telemetry</text>
      <text x="0" y="62" font-size="11" fill="#E2E8F0">&#160;&#160;<tspan fill="#F472B6">const</tspan> metrics = <tspan fill="#F472B6">await</tspan> github.rest.stats();</text>
      <text x="0" y="84" font-size="11" fill="#E2E8F0">&#160;&#160;assert(metrics.commits &gt;= <tspan fill="#F59E0B">3047</tspan>, <tspan fill="#10B981">"Data Truth"</tspan>);</text>
      <text x="0" y="106" font-size="11" fill="#64748B">&#160;&#160;// 2. Render verified SVG HUD</text>
      <text x="0" y="128" font-size="11" fill="#E2E8F0">&#160;&#160;<tspan fill="#F472B6">const</tspan> hud = <tspan fill="#F472B6">await</tspan> renderCinemaHUD(metrics);</text>
      <text x="0" y="150" font-size="11" fill="#E2E8F0">&#160;&#160;<tspan fill="#F472B6">return</tspan> { truth: <tspan fill="#F59E0B">1.0</tspan>, status: <tspan fill="#10B981">"ONLINE"</tspan> };</text>
      <text x="0" y="172" font-size="11" fill="#818CF8">}</text>
      <text x="0" y="200" font-size="11" font-weight="700" fill="#10B981">&gt;&gt; [DEPLOY COMPLETE: 0 ERRORS // 100% HEALTH]</text>
    </g>
  </g>

  <!-- Flickering Cyber Neon Sign -->
  <g transform="translate(720, 412)">
    <rect x="0" y="0" width="504" height="74" rx="10" fill="#070C15" stroke="#1E293B" stroke-width="1"/>
    <g class="neon-flicker">
      <rect x="12" y="12" width="480" height="50" rx="6" fill="#0C1B2E" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8 4"/>
      <text class="sans" x="252" y="44" text-anchor="middle" font-size="18" font-weight="900" fill="#38BDF8" letter-spacing="3.5">⚡ KEEP SHIPPING · ZERO FAKE DATA ⚡</text>
    </g>
  </g>

  <!-- Mini Radar Nav Telemetry -->
  <g transform="translate(1180, 140)">
    <g class="reticle-spin">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-dasharray="2 3"/>
      <line x1="0" y1="-32" x2="0" y2="32" stroke="#38BDF8" stroke-opacity="0.3"/>
      <line x1="-32" y1="0" x2="32" y2="0" stroke="#38BDF8" stroke-opacity="0.3"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="#38BDF8"/>
  </g>

  <!-- Floating Twinkle Particles -->
  <g class="floating-particle">
    <circle cx="150" cy="510" r="1.5" fill="#38BDF8"/>
    <circle cx="480" cy="140" r="1.2" fill="#818CF8"/>
    <circle cx="680" cy="460" r="1.8" fill="#C084FC"/>
    <circle cx="1120" cy="360" r="1.4" fill="#38BDF8"/>
  </g>

  <!-- ── 7. FOOTER AUDIT BAR ──────────────────────────────────── -->
  <g transform="translate(56, 672)">
    <rect x="0" y="-18" width="1168" height="28" rx="6" fill="#090E18" stroke="#1E293B" stroke-width="1"/>
    
    <circle cx="16" cy="-4" r="4.5" fill="#10B981"/>
    <text x="28" y="0" font-size="10.5" font-weight="700" fill="#10B981" letter-spacing="1.2">SYSTEM STATUS: FULLY OPERATIONAL</text>

    <line x1="280" y1="-14" x2="280" y2="6" stroke="#1E293B"/>
    <text x="296" y="0" font-size="10.5" fill="#94A3B8" letter-spacing="0.8">ENGINE: <tspan fill="#38BDF8" font-weight="700">GITHUB REST v3 + SEARCH API</tspan></text>

    <line x1="600" y1="-14" x2="600" y2="6" stroke="#1E293B"/>
    <text x="616" y="0" font-size="10.5" fill="#94A3B8" letter-spacing="0.8">VERIFIED CADENCE: <tspan fill="#F59E0B" font-weight="700">DAILY 02:30 UTC AUTOMATION</tspan></text>

    <line x1="940" y1="-14" x2="940" y2="6" stroke="#1E293B"/>
    <text x="1152" y="0" text-anchor="end" font-size="10" fill="#64748B" letter-spacing="1">SECURITY: CRYPTOGRAPHICALLY AUDITED</text>
  </g>

</svg>
