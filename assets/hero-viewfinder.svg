<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Sudhir Singh — Systems &amp; DevOps Engineer">
  <title>Sudhir Singh — Systems &amp; DevOps Engineer</title>
  <desc>Cinema-grade 1280x560 anamorphic viewfinder HUD with optical camera telemetry, live terminal command execution, animated code card, and systems engineering profile.</desc>

  <defs>
    <style type="text/css"><![CDATA[
text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sg { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .sgm { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
      .jb { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .jbb { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 700; }

      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeL { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes popIn {
        0% { opacity: 0; transform: translateY(16px) scale(.75); }
        70% { opacity: 1; transform: translateY(-3px) scale(1.05); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes cornerDraw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
      @keyframes laserScan {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: .85; }
        85% { opacity: .85; }
        100% { transform: translateY(430px); opacity: 0; }
      }
      @keyframes neonFlicker {
        0% { opacity: 0; }
        4% { opacity: .8; }
        6% { opacity: .15; }
        10% { opacity: .95; }
        14% { opacity: .4; }
        18%, 100% { opacity: 1; }
      }
      @keyframes roleCycle {
        0%, 30% { opacity: 1; transform: translateY(0); }
        33%, 97% { opacity: 0; transform: translateY(-14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes roleCycle2 {
        0%, 30% { opacity: 0; transform: translateY(14px); }
        33%, 63% { opacity: 1; transform: translateY(0); }
        66%, 100% { opacity: 0; transform: translateY(-14px); }
      }
      @keyframes roleCycle3 {
        0%, 63% { opacity: 0; transform: translateY(14px); }
        66%, 96% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-14px); }
      }
      @keyframes codeLineReveal {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }

      .fu { animation: fadeUp .7s cubic-bezier(.2,.8,.2,1) both; }
      .fi { animation: fadeIn .7s ease both; }
      .fl { animation: fadeL .7s cubic-bezier(.2,.8,.2,1) both; }
      .cur { animation: blink 1s step-end infinite; }
      .corner { stroke-dasharray: 60; animation: cornerDraw .8s ease both; }
      .scanner-beam { animation: laserScan 4.5s ease-in-out infinite; }
      .neon-sign { animation: neonFlicker 3s ease-out forwards; }
      .role-1 { animation: roleCycle 12s cubic-bezier(.2,.8,.2,1) infinite; }
      .role-2 { animation: roleCycle2 12s cubic-bezier(.2,.8,.2,1) infinite; }
      .role-3 { animation: roleCycle3 12s cubic-bezier(.2,.8,.2,1) infinite; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    ]]></style>

    <!-- Background and Aurora Gradients -->
    <linearGradient id="hpanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E131F"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="hedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset=".5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38BDF8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laserLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blurHaloL" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blurHaloR" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#818CF8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="hdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r=".9" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>

    <clipPath id="heroClip">
      <rect width="1280" height="560" rx="24"/>
    </clipPath>
    <clipPath id="vfClip">
      <rect x="660" y="44" width="564" height="472" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <!-- Base Canvas -->
    <rect width="1280" height="560" fill="url(#hpanel)"/>
    <rect width="1280" height="560" fill="url(#hdots)"/>
    <circle cx="180" cy="140" r="240" fill="url(#blurHaloL)"/>
    <circle cx="980" cy="400" r="280" fill="url(#blurHaloR)"/>
    <rect x=".75" y=".75" width="1278.5" height="558.5" rx="23.25" fill="none" stroke="url(#hedge)" stroke-width="1.5"/>

    <!-- ── LEFT SIDE: IDENTITY & TELEMETRY (x=56 to x=620) ──────── -->
    <!-- Status Pill -->
    <g transform="translate(56,44)" class="fu">
      <rect x="0" y="0" width="180" height="28" rx="14" fill="#10B981" fill-opacity=".1" stroke="#10B981" stroke-opacity=".35"/>
      <circle cx="14" cy="14" r="4" fill="#10B981"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text class="jbb" x="26" y="18" font-size="10" fill="#10B981" letter-spacing="1.2">OPEN TO WORK &#183; IN</text>
    </g>

    <!-- Terminal Prompt Line -->
    <g transform="translate(56,106)" class="fu" style="animation-delay:.15s">
      <text class="jb" font-size="13" fill="#64748B">user@systems:~$ </text>
      <text class="jbb" x="136" font-size="13" fill="#38BDF8">./boot-profile --production</text>
      <rect class="cur" x="350" y="-11" width="8" height="15" fill="#38BDF8"/>
    </g>

    <!-- Name in Massive Space Grotesk Bold -->
    <g transform="translate(56,176)" class="fu" style="animation-delay:.25s">
      <text class="sg" font-size="58" font-weight="800" fill="url(#nameG)" letter-spacing="-1.5">SUDHIR SINGH</text>
    </g>

    <!-- Dynamic Cycling Role Lines -->
    <g transform="translate(56,218)">
      <g class="role-1">
        <text class="jbb" font-size="15" fill="#38BDF8" letter-spacing="1.4">&#62; SYSTEMS &amp; CLOUD DEVOPS ARCHITECT</text>
      </g>
      <g class="role-2">
        <text class="jbb" font-size="15" fill="#C084FC" letter-spacing="1.4">&#62; FULL-STACK SYSTEMS &amp; TOOLING</text>
      </g>
      <g class="role-3">
        <text class="jbb" font-size="15" fill="#10B981" letter-spacing="1.4">&#62; AUTONOMOUS CI/CD PIPELINE ENGINEER</text>
      </g>
    </g>

    <!-- Mission One-Liner Description -->
    <g transform="translate(56,260)" class="fu" style="animation-delay:.4s">
      <text class="sgm" font-size="15" fill="#E2E8F0" letter-spacing="-.2">Architecting resilient web systems, automated cron health gates,</text>
      <text class="sgm" y="24" font-size="15" fill="#94A3B8" letter-spacing="-.2">and client-side cryptographic tools with zero-knowledge privacy.</text>
    </g>

    <!-- Telemetry Stats Strip -->
    <g transform="translate(56,336)" class="fu" style="animation-delay:.5s">
      <rect x="0" y="0" width="560" height="48" rx="12" fill="#0B1220" stroke="#1E293B"/>
      
      <circle cx="20" cy="24" r="3" fill="#38BDF8"/>
      <text class="jb" x="30" y="28" font-size="10.5" fill="#94A3B8">BASE: <tspan class="jbb" fill="#E2E8F0">BIHAR, IN</tspan></text>

      <line x1="160" y1="12" x2="160" y2="36" stroke="#1E293B"/>

      <circle cx="178" cy="24" r="3" fill="#10B981"/>
      <text class="jb" x="188" y="28" font-size="10.5" fill="#94A3B8">REPOS: <tspan class="jbb" fill="#E2E8F0">77 PUBLIC</tspan></text>

      <line x1="316" y1="12" x2="316" y2="36" stroke="#1E293B"/>

      <circle cx="334" cy="24" r="3" fill="#C084FC"/>
      <text class="jb" x="344" y="28" font-size="10.5" fill="#94A3B8">COMMITS: <tspan class="jbb" fill="#E2E8F0">3,053 AUTHORED</tspan></text>
    </g>

    <!-- Tech Arsenal Glyph Strip -->
    <g transform="translate(56,412)" class="fu" style="animation-delay:.6s">
      <rect x="0" y="0" width="86" height="28" rx="8" fill="#1E293B" fill-opacity=".6"/>
      <text class="jbb" x="43" y="18" font-size="10.5" fill="#38BDF8" text-anchor="middle">TypeScript</text>

      <rect x="94" y="0" width="68" height="28" rx="8" fill="#1E293B" fill-opacity=".6"/>
      <text class="jbb" x="128" y="18" font-size="10.5" fill="#60A5FA" text-anchor="middle">Docker</text>

      <rect x="170" y="0" width="74" height="28" rx="8" fill="#1E293B" fill-opacity=".6"/>
      <text class="jbb" x="207" y="18" font-size="10.5" fill="#34D399" text-anchor="middle">Node.js</text>

      <rect x="252" y="0" width="62" height="28" rx="8" fill="#1E293B" fill-opacity=".6"/>
      <text class="jbb" x="283" y="18" font-size="10.5" fill="#FBBF24" text-anchor="middle">Linux</text>

      <rect x="322" y="0" width="70" height="28" rx="8" fill="#1E293B" fill-opacity=".6"/>
      <text class="jbb" x="357" y="18" font-size="10.5" fill="#A78BFA" text-anchor="middle">FastAPI</text>

      <rect x="400" y="0" width="118" height="28" rx="8" fill="#1E293B" fill-opacity=".6"/>
      <text class="jbb" x="459" y="18" font-size="10.5" fill="#F472B6" text-anchor="middle">GitHub Actions</text>
    </g>

    <!-- Neon Computational Honesty Sign -->
    <g transform="translate(56,488)" class="neon-sign">
      <rect x="0" y="0" width="460" height="28" rx="6" fill="#0B1220" stroke="#38BDF8" stroke-opacity=".4"/>
      <text class="jbb" x="230" y="18" font-size="10" fill="#38BDF8" text-anchor="middle" letter-spacing="1.8">&#9889; 100% COMPUTATIONAL HONESTY &#183; ZERO FAKE DATA &#9889;</text>
    </g>

    <!-- ── RIGHT SIDE: ANAMORPHIC VIEWFINDER HUD (x=660 to x=1224) ─── -->
    <g>
      <!-- Viewfinder Backdrop -->
      <rect x="660" y="44" width="564" height="472" rx="16" fill="#070A11" stroke="#1E293B"/>

      <!-- Drawn-in Optical Reticle Corner Brackets -->
      <g stroke="#38BDF8" stroke-width="2.5" fill="none" class="corner">
        <path d="M 676 68 L 676 56 L 688 56"/>
        <path d="M 1208 68 L 1208 56 L 1196 56"/>
        <path d="M 676 492 L 676 504 L 688 504"/>
        <path d="M 1208 492 L 1208 504 L 1196 504"/>
      </g>

      <!-- Viewfinder Optical Telemetry Bar -->
      <g transform="translate(688,74)">
        <circle cx="6" cy="4" r="4" fill="#EF4444"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
        <text class="jbb" x="18" y="8" font-size="9.5" fill="#EF4444" letter-spacing="1.2">REC [LIVE HUD]</text>

        <text class="jb" x="156" y="8" font-size="9" fill="#64748B">FOCAL 50mm &#183; &#402;/1.4 &#183; ISO 100</text>
        <text class="jb" x="508" y="8" font-size="9" fill="#38BDF8" text-anchor="end">25.5941&#176; N // 85.1376&#176; E</text>
      </g>

      <!-- Code Editor Card Window Inside Viewfinder -->
      <g transform="translate(684,102)">
        <rect width="516" height="364" rx="12" fill="#0B1220" stroke="#1E293B"/>
        
        <!-- Window Controls -->
        <circle cx="20" cy="18" r="4.5" fill="#EF4444" fill-opacity=".8"/>
        <circle cx="36" cy="18" r="4.5" fill="#F59E0B" fill-opacity=".8"/>
        <circle cx="52" cy="18" r="4.5" fill="#10B981" fill-opacity=".8"/>

        <!-- Active File Tab -->
        <rect x="74" y="6" width="168" height="24" rx="6" fill="#161F30"/>
        <circle cx="86" cy="18" r="2.5" fill="#38BDF8"/>
        <text class="jb" x="96" y="21" font-size="9.5" fill="#94A3B8">deploy-profile.ts</text>

        <line x1="0" y1="34" x2="516" y2="34" stroke="#1E293B"/>

        <!-- Code Lines Writing Out Line-by-Line -->
        <g transform="translate(20,68)">
          <text class="jb" font-size="11.5" fill="#818CF8">const <tspan fill="#38BDF8">engineer</tspan> = <tspan fill="#F59E0B">new</tspan> SystemsArchitect({</text>
          
          <text class="jb" y="28" font-size="11.5" fill="#64748B">  handle: <tspan fill="#10B981">"@SudhirDevOps1"</tspan>,</text>
          
          <text class="jb" y="56" font-size="11.5" fill="#64748B">  focus: [<tspan fill="#10B981">"Cloud Systems"</tspan>, <tspan fill="#10B981">"CI/CD"</tspan>, <tspan fill="#10B981">"FullStack"</tspan>],</text>
          
          <text class="jb" y="84" font-size="11.5" fill="#64748B">  dataIntegrity: <tspan fill="#38BDF8">"100% Real API Metrics"</tspan>,</text>
          
          <text class="jb" y="112" font-size="11.5" fill="#64748B">  pipelineStatus: <tspan fill="#10B981">"ALL_SYSTEMS_OPERATIONAL"</tspan></text>
          
          <text class="jb" y="140" font-size="11.5" fill="#818CF8">});</text>
          
          <text class="jb" y="180" font-size="11.5" fill="#F59E0B">await <tspan fill="#38BDF8">engineer</tspan>.<tspan fill="#10B981">deployVerifiedProfile</tspan>();</text>

          <g transform="translate(0,224)">
            <rect width="476" height="42" rx="8" fill="#070A11" stroke="#10B981" stroke-opacity=".3"/>
            <circle cx="16" cy="21" r="3.5" fill="#10B981"/>
            <text class="jbb" x="28" y="25" font-size="10" fill="#10B981">&#62; BUILD COMPLETE: 0 errors &#183; telemetry verified</text>
          </g>
        </g>
      </g>

      <!-- Laser Scanner Beam Sweeping Viewfinder -->
      <g clip-path="url(#vfClip)">
        <g class="scanner-beam">
          <rect x="660" y="44" width="564" height="28" fill="url(#scanGrad)"/>
          <line x1="660" y1="72" x2="1224" y2="72" stroke="url(#laserLine)" stroke-width="1.5"/>
        </g>
      </g>

      <!-- Viewfinder Bottom Scrubber Bar -->
      <g transform="translate(684,490)">
        <rect width="516" height="4" rx="2" fill="#1E293B"/>
        <rect width="210" height="4" rx="2" fill="url(#nameG)"><animate attributeName="width" values="0;516" dur="4.5s" repeatCount="indefinite"/></rect>
        <circle cx="0" cy="2" r="4" fill="#38BDF8"><animate attributeName="cx" values="0;516" dur="4.5s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>
</svg>
