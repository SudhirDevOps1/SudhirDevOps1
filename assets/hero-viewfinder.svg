<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-label="Sudhir Singh — Systems &amp; DevOps Engineer">
  <title>Sudhir Singh — Systems &amp; DevOps Engineer</title>
  <desc>Cinema-grade 1280x580 hero banner with HUD telemetry, animated identity, tech arsenal pills, and holographic containment pod.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sg  { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .sgm { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
      .jb  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .jbb { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 700; }

      @keyframes blink   { 0%,49%{opacity:1}50%,100%{opacity:0} }
      @keyframes neonFlicker { 0%,100%{opacity:1} 4%{opacity:.85} 6%{opacity:.4} 10%{opacity:.95} 14%{opacity:.6} 18%{opacity:1} }
      @keyframes rotateCW  { from{transform:rotate(0deg)}  to{transform:rotate(360deg)} }
      @keyframes rotateCCW { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
      @keyframes pulseGlow { 0%,100%{opacity:.55;transform:scale(1)} 50%{opacity:.9;transform:scale(1.05)} }
      @keyframes eqBar1 { 0%,100%{height:20px;y:450px} 50%{height:46px;y:424px} }
      @keyframes eqBar2 { 0%,100%{height:38px;y:432px} 50%{height:12px;y:458px} }
      @keyframes eqBar3 { 0%,100%{height:28px;y:442px} 50%{height:52px;y:418px} }
      @keyframes eqBar4 { 0%,100%{height:48px;y:422px} 50%{height:20px;y:450px} }
      @keyframes eqBar5 { 0%,100%{height:16px;y:454px} 50%{height:38px;y:432px} }
      @keyframes eqBar6 { 0%,100%{height:34px;y:436px} 50%{height:58px;y:412px} }
      @keyframes eqBar7 { 0%,100%{height:22px;y:448px} 50%{height:44px;y:426px} }
      @keyframes scanLine { 0%{transform:translateY(40px);opacity:0} 10%{opacity:.85} 90%{opacity:.85} 100%{transform:translateY(390px);opacity:0} }
      @keyframes statusDot { 0%,100%{opacity:1} 50%{opacity:.15} }

      .neon    { animation: neonFlicker 7s infinite; }
      .rotCW   { transform-box:fill-box; transform-origin:center; animation: rotateCW 20s linear infinite; }
      .rotCCW  { transform-box:fill-box; transform-origin:center; animation: rotateCCW 15s linear infinite; }
      .pCore   { transform-box:fill-box; transform-origin:center; animation: pulseGlow 3.5s ease-in-out infinite; }
      .eq1 { animation: eqBar1 1.2s ease-in-out infinite; }
      .eq2 { animation: eqBar2 0.9s ease-in-out infinite; }
      .eq3 { animation: eqBar3 1.5s ease-in-out infinite; }
      .eq4 { animation: eqBar4 1.1s ease-in-out infinite; }
      .eq5 { animation: eqBar5 1.4s ease-in-out infinite; }
      .eq6 { animation: eqBar6 0.85s ease-in-out infinite; }
      .eq7 { animation: eqBar7 1.3s ease-in-out infinite; }
      .scan { animation: scanLine 5s ease-in-out infinite; }
      .sd  { animation: statusDot 1.6s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        *, .neon, .rotCW, .rotCCW, .pCore, .eq1, .eq2, .eq3, .eq4, .eq5, .eq6, .eq7, .scan, .sd {
          animation: none !important;
        }
      }
    ]]></style>

    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#06080F"/>
      <stop offset="40%"  stop-color="#0D1525"/>
      <stop offset="100%" stop-color="#06080F"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="30%"  stop-color="#818CF8"/>
      <stop offset="65%"  stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#38BDF8" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="holoBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity=".04"/>
      <stop offset="50%"  stop-color="#818CF8" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="holoCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity=".45"/>
      <stop offset="45%"  stop-color="#818CF8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#06080F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="visorG" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </radialGradient>
    <pattern id="hudGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity=".6"/>
      <circle cx="0" cy="0" r="0.9" fill="#38BDF8" fill-opacity=".35"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="heroClip">
      <rect width="1280" height="580" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <!-- Base surface -->
    <rect width="1280" height="580" fill="url(#bgG)"/>
    <rect width="1280" height="580" fill="url(#hudGrid)"/>
    <rect x=".75" y=".75" width="1278.5" height="578.5" rx="15.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Corner crosshair brackets -->
    <path d="M 24 54 L 24 24 L 54 24" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1226 24 L 1256 24 L 1256 54" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 24 526 L 24 556 L 54 556" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1226 556 L 1256 556 L 1256 526" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Center tick marks -->
    <line x1="626" y1="12" x2="654" y2="12" stroke="#38BDF8" stroke-width="1.5" stroke-opacity=".6"/>
    <line x1="640" y1="6"  x2="640" y2="22" stroke="#38BDF8" stroke-width="1.5" stroke-opacity=".6"/>
    <line x1="626" y1="568" x2="654" y2="568" stroke="#38BDF8" stroke-width="1.5" stroke-opacity=".6"/>
    <line x1="640" y1="558" x2="640" y2="574" stroke="#38BDF8" stroke-width="1.5" stroke-opacity=".6"/>

    <!-- TOP TELEMETRY STRIP -->
    <g transform="translate(54,42)">
      <circle cx="6" cy="0" r="5" fill="#EF4444" class="sd"/>
      <text x="18" y="4" class="jbb" font-size="11" fill="#EF4444" letter-spacing="1.5">REC [&#9679;] LIVE</text>
      <text x="130" y="4" class="jb" font-size="10" fill="#94A3B8" letter-spacing="1">ISO 800 &#183; F/2.8 &#183; 1/250s</text>
      <text x="316" y="4" class="jb" font-size="10" fill="#38BDF8" letter-spacing="1.2">SYS::ARMED // K8S-PROD-CLUSTER</text>
      <text x="1172" y="4" class="jb" font-size="10" fill="#94A3B8" text-anchor="end" letter-spacing="1">LAT 25.09°N &#183; LONG 85.31°E</text>
    </g>

    <!-- ══ LEFT COLUMN: TERMINAL + IDENTITY (x=54, w=620) ══ -->
    <g transform="translate(54,76)">
      <!-- Terminal window -->
      <rect width="620" height="456" rx="14" fill="#0A0F1E" stroke="#1E293B" stroke-width="1.5"/>
      <!-- Title bar -->
      <rect width="620" height="38" rx="14" fill="#0F1A30"/>
      <rect y="24" width="620" height="14" fill="#0F1A30"/>
      <circle cx="20" cy="19" r="5.5" fill="#FF5F56"/>
      <circle cx="38" cy="19" r="5.5" fill="#FFBD2E"/>
      <circle cx="56" cy="19" r="5.5" fill="#27C93F"/>
      <text x="310" y="23" class="jb" font-size="10" fill="#64748B" text-anchor="middle">sudhir@mesh-control:~ (prod)</text>

      <!-- Terminal prompt -->
      <g transform="translate(22,64)">
        <text class="jbb" font-size="12" fill="#38BDF8">$</text>
        <text x="16" y="0" class="jb" font-size="12" fill="#CBD5E1">./deploy-mesh.sh --cluster=k8s-prod --telemetry=live</text>
        <rect x="444" y="-11" width="8" height="14" fill="#38BDF8"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect>
      </g>

      <!-- Name -->
      <text class="sg" x="22" y="142" font-size="52" fill="url(#nameG)" letter-spacing="-1.5">Sudhir Singh</text>

      <!-- Role badge — always visible, one static role -->
      <g transform="translate(22,162)">
        <rect width="324" height="26" rx="6" fill="#0D1A30" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1"/>
        <text x="12" y="18" class="jbb" font-size="12" fill="#38BDF8" letter-spacing=".8">// SYSTEMS &amp; DEVOPS ENGINEER</text>
      </g>

      <!-- Tech pills row 1 -->
      <g transform="translate(22,200)">
        <rect width="104" height="26" rx="13" fill="#162238" stroke="#38BDF8" stroke-width="1" stroke-opacity=".8"/>
        <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
        <text x="26" y="17.5" class="jbb" font-size="10" fill="#F1F5F9">Kubernetes</text>

        <rect x="112" width="80" height="26" rx="13" fill="#162238" stroke="#818CF8" stroke-width="1" stroke-opacity=".8"/>
        <circle cx="126" cy="13" r="4" fill="#818CF8"/>
        <text x="138" y="17.5" class="jbb" font-size="10" fill="#F1F5F9">Docker</text>

        <rect x="200" width="96" height="26" rx="13" fill="#162238" stroke="#C084FC" stroke-width="1" stroke-opacity=".8"/>
        <circle cx="214" cy="13" r="4" fill="#C084FC"/>
        <text x="226" y="17.5" class="jbb" font-size="10" fill="#F1F5F9">Terraform</text>

        <rect x="304" width="102" height="26" rx="13" fill="#162238" stroke="#38BDF8" stroke-width="1" stroke-opacity=".8"/>
        <circle cx="318" cy="13" r="4" fill="#38BDF8"/>
        <text x="330" y="17.5" class="jbb" font-size="10" fill="#F1F5F9">TypeScript</text>

        <rect x="414" width="82" height="26" rx="13" fill="#162238" stroke="#F59E0B" stroke-width="1" stroke-opacity=".8"/>
        <circle cx="428" cy="13" r="4" fill="#F59E0B"/>
        <text x="440" y="17.5" class="jbb" font-size="10" fill="#F1F5F9">Python</text>

        <rect x="504" width="88" height="26" rx="13" fill="#162238" stroke="#10B981" stroke-width="1" stroke-opacity=".8"/>
        <circle cx="518" cy="13" r="4" fill="#10B981"/>
        <text x="530" y="17.5" class="jbb" font-size="10" fill="#F1F5F9">Linux CI</text>
      </g>

      <!-- Code card -->
      <g transform="translate(22,240)">
        <rect width="576" height="156" rx="10" fill="#07090F" stroke="#1E293B" stroke-width="1.2"/>
        <rect width="576" height="28" rx="10" fill="#0D1525"/>
        <rect y="18" width="576" height="10" fill="#0D1525"/>
        <circle cx="14" cy="14" r="3.5" fill="#38BDF8"/>
        <text x="28" y="18" class="jb" font-size="9" fill="#64748B">cluster-mesh.config.ts &#183; UTF-8 &#183; LF</text>
        <g transform="translate(16,46)">
          <text class="jb" font-size="11" fill="#475569">01</text>
          <text x="28" y="0" class="jb" font-size="11" fill="#F43F5E">export const </text>
          <text x="122" y="0" class="jb" font-size="11" fill="#38BDF8">architect</text>
          <text x="198" y="0" class="jb" font-size="11" fill="#E2E8F0">: SystemsEngineer = {</text>

          <text y="22" class="jb" font-size="11" fill="#475569">02</text>
          <text x="44" y="22" class="jb" font-size="11" fill="#818CF8">lead</text>
          <text x="80" y="22" class="jb" font-size="11" fill="#E2E8F0">: </text>
          <text x="96" y="22" class="jb" font-size="11" fill="#10B981">"Sudhir Singh"</text>
          <text x="212" y="22" class="jb" font-size="11" fill="#E2E8F0">, </text>
          <text x="232" y="22" class="jb" font-size="11" fill="#818CF8">resilience</text>
          <text x="328" y="22" class="jb" font-size="11" fill="#F59E0B">: 99.999</text>

          <text y="44" class="jb" font-size="11" fill="#475569">03</text>
          <text x="44" y="44" class="jb" font-size="11" fill="#818CF8">focus</text>
          <text x="88" y="44" class="jb" font-size="11" fill="#E2E8F0">: [</text>
          <text x="112" y="44" class="jb" font-size="11" fill="#10B981">"Zero-Downtime CI/CD"</text>
          <text x="300" y="44" class="jb" font-size="11" fill="#E2E8F0">, </text>
          <text x="320" y="44" class="jb" font-size="11" fill="#10B981">"K8s Clusters"</text>
          <text x="440" y="44" class="jb" font-size="11" fill="#E2E8F0">],</text>

          <text y="66" class="jb" font-size="11" fill="#475569">04</text>
          <text x="44" y="66" class="jb" font-size="11" fill="#818CF8">status</text>
          <text x="96" y="66" class="jb" font-size="11" fill="#E2E8F0">: </text>
          <text x="112" y="66" class="jb" font-size="11" fill="#38BDF8">"READY_TO_DEPLOY"</text>
          <rect x="254" y="55" width="7" height="13" fill="#10B981"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>

          <text y="88" class="jb" font-size="11" fill="#475569">05</text>
          <text x="28" y="88" class="jb" font-size="11" fill="#E2E8F0">};</text>
        </g>
      </g>

      <!-- Availability neon banner -->
      <g transform="translate(22,410)" class="neon">
        <rect width="576" height="40" rx="8" fill="#0A1520" stroke="#10B981" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="5" fill="#10B981" filter="url(#glow)"/>
        <text x="34" y="24" class="jbb" font-size="11" fill="#10B981" letter-spacing="1.4">AVAILABILITY: OPEN TO CONTRACT &amp; FULL-TIME ROLES</text>
        <text x="556" y="24" class="jb" font-size="9.5" fill="#94A3B8" text-anchor="end">BIHAR, IN // UTC+05:30</text>
      </g>
    </g>

    <!-- ══ RIGHT COLUMN: HOLO POD (x=710, w=516) ══ -->
    <g transform="translate(710,76)">
      <!-- Pod frame -->
      <rect width="516" height="456" rx="14" fill="#0A0F1E" stroke="#1E293B" stroke-width="1.5"/>
      <!-- Pod header bar -->
      <rect width="516" height="38" rx="14" fill="#0F1A30"/>
      <rect y="24" width="516" height="14" fill="#0F1A30"/>
      <text x="22" y="23" class="jbb" font-size="10" fill="#38BDF8" letter-spacing="1.6">// HOLO-CONTAINMENT MATRIX</text>
      <text x="494" y="23" class="jb" font-size="10" fill="#94A3B8" text-anchor="end">SEC-LVL: ALPHA</text>

      <!-- Ambient radial core glow -->
      <circle cx="258" cy="224" r="170" fill="url(#holoCore)" class="pCore"/>

      <!-- Rotating rings -->
      <circle cx="258" cy="224" r="150" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-opacity=".5" stroke-dasharray="6 5" class="rotCW"/>
      <circle cx="258" cy="224" r="124" fill="none" stroke="#818CF8" stroke-width="1.6" stroke-opacity=".6" stroke-dasharray="14 7" class="rotCCW"/>
      <circle cx="258" cy="224" r="98"  fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity=".3"/>

      <!-- Rotating ring satellite dots -->
      <circle cx="408" cy="224" r="7" fill="#38BDF8" class="rotCW" filter="url(#glow)"/>
      <circle cx="134" cy="224" r="7" fill="#818CF8" class="rotCCW" filter="url(#glow)"/>

      <!-- Laser scanner sweep -->
      <g class="scan">
        <line x1="40" y1="40" x2="476" y2="40" stroke="url(#scanG)" stroke-width="3" filter="url(#glow)"/>
        <polygon points="40,40 476,40 460,65 56,65" fill="url(#holoBeam)"/>
      </g>

      <!-- Silhouette group centered at 258,224 -->
      <g transform="translate(258,224)">
        <!-- Pedestal -->
        <ellipse cx="0" cy="124" rx="96" ry="20" fill="#132033" stroke="#38BDF8" stroke-width="1.8"/>
        <ellipse cx="0" cy="124" rx="70" ry="13" fill="none" stroke="#818CF8" stroke-width="1" stroke-dasharray="5 3"/>
        <!-- Projection cone rays -->
        <polygon points="-76,124 76,124 44,-96 -44,-96" fill="url(#holoBeam)"/>

        <!-- Torso / shoulders -->
        <path d="M -58 116 C -54 68, -38 42, -24 28 L 24 28 C 38 42, 54 68, 58 116 Z" fill="#162238" stroke="#38BDF8" stroke-width="1.8"/>
        <!-- Armor seams -->
        <path d="M -24 28 L -16 76 L 0 88 L 16 76 L 24 28" fill="none" stroke="#818CF8" stroke-width="1.5"/>
        <line x1="0" y1="28" x2="0" y2="88" stroke="#38BDF8" stroke-width="1.5"/>
        <!-- Chest core indicator -->
        <circle cx="0" cy="58" r="6" fill="#38BDF8" fill-opacity=".2" stroke="#38BDF8" stroke-width="1.2" filter="url(#glow)"/>
        <circle cx="0" cy="58" r="2.5" fill="#38BDF8"/>

        <!-- Head and helmet -->
        <path d="M -22 20 C -26 -18, -20 -42, 0 -42 C 20 -42, 26 -18, 22 20 Z" fill="#0D1525" stroke="#38BDF8" stroke-width="1.8"/>
        <!-- Visor -->
        <path d="M -17 -6 L 17 -6 Q 14 8 0 8 Q -14 8 -17 -6 Z" fill="url(#visorG)" filter="url(#glow)">
          <animate attributeName="opacity" values="1;.7;1" dur="2s" repeatCount="indefinite"/>
        </path>
        <!-- Head orbital ring -->
        <ellipse cx="0" cy="-14" rx="40" ry="10" fill="none" stroke="#C084FC" stroke-width="1.4" stroke-dasharray="5 2">
          <animateTransform attributeName="transform" type="rotate" values="0 0 -14;360 0 -14" dur="8s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- Equalizer bars (wider, more bars, more visible) -->
      <g transform="translate(44,0)">
        <rect x="0"  y="440" width="8" height="22" rx="4" fill="#38BDF8" class="eq1"/>
        <rect x="14" y="440" width="8" height="22" rx="4" fill="#818CF8" class="eq2"/>
        <rect x="28" y="440" width="8" height="22" rx="4" fill="#C084FC" class="eq3"/>
        <rect x="42" y="440" width="8" height="22" rx="4" fill="#38BDF8" class="eq4"/>
        <rect x="56" y="440" width="8" height="22" rx="4" fill="#10B981" class="eq5"/>
        <rect x="70" y="440" width="8" height="22" rx="4" fill="#818CF8" class="eq6"/>
        <rect x="84" y="440" width="8" height="22" rx="4" fill="#38BDF8" class="eq7"/>
        <text x="102" y="470" class="jb" font-size="9" fill="#64748B">TELEMETRY FREQ // 44.1kHz</text>
      </g>

      <!-- Metrics box bottom right of pod -->
      <g transform="translate(248,432)">
        <rect width="236" height="52" rx="8" fill="#07090F" stroke="#1E293B" stroke-width="1"/>
        <circle cx="14" cy="16" r="3.5" fill="#10B981" class="sd"/>
        <text x="26" y="20" class="jbb" font-size="9.5" fill="#E2E8F0">STABILITY: 99.999%</text>
        <text x="148" y="20" class="jb" font-size="9" fill="#38BDF8">NODE: ACTIVE</text>
        <text x="26" y="38" class="jb" font-size="8.5" fill="#94A3B8">K8S INGRESS: 0ms PKT LOSS</text>
        <text x="168" y="38" class="jb" font-size="8.5" fill="#10B981">&#9650; PROD MESH</text>
      </g>
    </g>

    <!-- BOTTOM TICKER STRIP -->
    <g transform="translate(54,546)">
      <line x1="0" y1="-8" x2="1172" y2="-8" stroke="#1E293B" stroke-width="1"/>
      <text x="0"    y="8" class="jbb" font-size="10" fill="#38BDF8" letter-spacing="1">SUDHIR.SYSTEMS.V6</text>
      <text x="180"  y="8" class="jb"  font-size="9.5" fill="#94A3B8">CLUSTER HEALTH: NOMINAL</text>
      <text x="390"  y="8" class="jb"  font-size="9.5" fill="#94A3B8">PIPELINES: 100% AUTOMATED</text>
      <text x="610"  y="8" class="jb"  font-size="9.5" fill="#94A3B8">DATA SOURCE: GITHUB REST v3</text>
      <text x="1172" y="8" class="jbb" font-size="9.5" fill="#10B981" text-anchor="end" letter-spacing="1">ALL SUBSYSTEMS ONLINE &#10003;</text>
    </g>
  </g>
</svg>
