<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 160" width="100%" height="160" role="img" aria-label="Autonomous CI/CD Pipeline Stream">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1325"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Stage Card Gradient -->
    <linearGradient id="stageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080e18" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Bus Glow Line -->
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="dataBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bus-pulse {
        animation: busFlow 3s linear infinite;
      }
      .node-pulse-cyan {
        animation: pulseCyan 2s ease-in-out infinite;
      }
      .node-pulse-purple {
        animation: pulsePurple 2.2s ease-in-out infinite;
      }
      .node-pulse-green {
        animation: pulseGreen 1.8s ease-in-out infinite;
      }
      .txt-mono {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
      .txt-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      @keyframes busFlow {
        0% { transform: translateX(80px); }
        100% { transform: translateX(1120px); }
      }
      @keyframes pulseCyan {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 2px #00E5FF); }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #00E5FF); }
      }
      @keyframes pulsePurple {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 2px #A855F7); }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #A855F7); }
      }
      @keyframes pulseGreen {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 2px #10B981); }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #10B981); }
      }

      @media (prefers-reduced-motion: reduce) {
        .bus-pulse, .node-pulse-cyan, .node-pulse-purple, .node-pulse-green {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect x="0" y="0" width="1280" height="160" rx="14" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="2" y="2" width="1276" height="156" rx="12" fill="none" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.25"/>

  <!-- Top Status Banner -->
  <g transform="translate(30, 22)">
    <circle cx="4" cy="4" r="3.5" fill="#10B981" class="node-pulse-green"/>
    <text x="16" y="7" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5" class="txt-mono">CONTINUOUS INTEGRATION &amp; DEPLOYMENT STREAM // AUTOMATED GATES</text>
    <text x="1220" y="7" text-anchor="end" fill="#94a3b8" font-size="10" letter-spacing="1" class="txt-mono">PIPELINE: <tspan fill="#10B981" font-weight="bold">ACTIVE</tspan> · DISPATCH: <tspan fill="#00E5FF">CRON DAILY</tspan> · DRIFT: <tspan fill="#A855F7">0</tspan></text>
  </g>

  <!-- Horizontal Power & Data Bus -->
  <line x1="80" y1="92" x2="1200" y2="92" stroke="url(#busGrad)" stroke-width="2.5" stroke-dasharray="12 8"/>
  <line x1="80" y1="92" x2="1200" y2="92" stroke="#1e293b" stroke-width="1"/>

  <!-- Animated Flying Data Pulse -->
  <g class="bus-pulse">
    <ellipse cx="0" cy="92" rx="45" ry="3" fill="url(#dataBeam)" filter="url(#neonPulse)"/>
    <circle cx="0" cy="92" r="3" fill="#FFFFFF"/>
  </g>

  <!-- ==================== STAGE 1: SOURCE / GITOPS ==================== -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="210" height="88" rx="8" fill="url(#stageBg)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="18" r="4" fill="#00E5FF" class="node-pulse-cyan"/>
    <text x="28" y="22" fill="#FFFFFF" font-size="11" font-weight="700" class="txt-sans">01 · SOURCE / GitOps</text>
    <text x="195" y="21" text-anchor="end" fill="#00E5FF" font-size="8" class="txt-mono">TRIGGER</text>
    <text x="16" y="44" fill="#94a3b8" font-size="10" class="txt-sans">Event: <tspan fill="#38bdf8">git push / PR / Cron</tspan></text>
    <text x="16" y="60" fill="#94a3b8" font-size="10" class="txt-sans">Branch: <tspan fill="#e2e8f0">main [rebase-clean]</tspan></text>
    <rect x="16" y="69" width="178" height="12" rx="3" fill="#070b14"/>
    <text x="22" y="78" fill="#10B981" font-size="8" font-weight="bold" class="txt-mono">✔ SHA VERIFIED · GPG SIGNED</text>
  </g>

  <!-- ==================== STAGE 2: CONTAINER BUILD ==================== -->
  <g transform="translate(300, 48)">
    <rect x="0" y="0" width="210" height="88" rx="8" fill="url(#stageBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="18" r="4" fill="#38bdf8" class="node-pulse-cyan"/>
    <text x="28" y="22" fill="#FFFFFF" font-size="11" font-weight="700" class="txt-sans">02 · CONTAINER BUILD</text>
    <text x="195" y="21" text-anchor="end" fill="#38bdf8" font-size="8" class="txt-mono">DOCKER</text>
    <text x="16" y="44" fill="#94a3b8" font-size="10" class="txt-sans">Engine: <tspan fill="#38bdf8">Docker / Podman OCI</tspan></text>
    <text x="16" y="60" fill="#94a3b8" font-size="10" class="txt-sans">Layer Cache: <tspan fill="#e2e8f0">BuildKit Optimized</tspan></text>
    <rect x="16" y="69" width="178" height="12" rx="3" fill="#070b14"/>
    <text x="22" y="78" fill="#38bdf8" font-size="8" font-weight="bold" class="txt-mono">✔ ZERO BLOAT · DISTROLESS</text>
  </g>

  <!-- ==================== STAGE 3: QUALITY & SECURITY GATES ==================== -->
  <g transform="translate(540, 48)">
    <rect x="0" y="0" width="210" height="88" rx="8" fill="url(#stageBg)" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="18" r="4" fill="#A855F7" class="node-pulse-purple"/>
    <text x="28" y="22" fill="#FFFFFF" font-size="11" font-weight="700" class="txt-sans">03 · SECURITY &amp; QUALITY</text>
    <text x="195" y="21" text-anchor="end" fill="#A855F7" font-size="8" class="txt-mono">VERIFY</text>
    <text x="16" y="44" fill="#94a3b8" font-size="10" class="txt-sans">Checks: <tspan fill="#c084fc">XML Valid · Size Budgets</tspan></text>
    <text x="16" y="60" fill="#94a3b8" font-size="10" class="txt-sans">Parity: <tspan fill="#e2e8f0">100% Cross-File Sync</tspan></text>
    <rect x="16" y="69" width="178" height="12" rx="3" fill="#070b14"/>
    <text x="22" y="78" fill="#A855F7" font-size="8" font-weight="bold" class="txt-mono">✔ 17/17 HEALTH CHECK PASS</text>
  </g>

  <!-- ==================== STAGE 4: K8s ORCHESTRATION ==================== -->
  <g transform="translate(780, 48)">
    <rect x="0" y="0" width="210" height="88" rx="8" fill="url(#stageBg)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="18" r="4" fill="#00E5FF" class="node-pulse-cyan"/>
    <text x="28" y="22" fill="#FFFFFF" font-size="11" font-weight="700" class="txt-sans">04 · K8s CLUSTER DEPLOY</text>
    <text x="195" y="21" text-anchor="end" fill="#00E5FF" font-size="8" class="txt-mono">HELM 3</text>
    <text x="16" y="44" fill="#94a3b8" font-size="10" class="txt-sans">Strategy: <tspan fill="#38bdf8">Canary / Rolling Update</tspan></text>
    <text x="16" y="60" fill="#94a3b8" font-size="10" class="txt-sans">Downtime: <tspan fill="#e2e8f0">0.00ms · TLS Ingress</tspan></text>
    <rect x="16" y="69" width="178" height="12" rx="3" fill="#070b14"/>
    <text x="22" y="78" fill="#00E5FF" font-size="8" font-weight="bold" class="txt-mono">✔ HEALTHY PODS · ZERO LOSS</text>
  </g>

  <!-- ==================== STAGE 5: OBSERVABILITY & TELEMETRY ==================== -->
  <g transform="translate(1010, 48)">
    <rect x="0" y="0" width="210" height="88" rx="8" fill="url(#stageBg)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="18" r="4" fill="#10B981" class="node-pulse-green"/>
    <text x="28" y="22" fill="#FFFFFF" font-size="11" font-weight="700" class="txt-sans">05 · LIVE OBSERVABILITY</text>
    <text x="195" y="21" text-anchor="end" fill="#10B981" font-size="8" class="txt-mono">MONITOR</text>
    <text x="16" y="44" fill="#94a3b8" font-size="10" class="txt-sans">Metrics: <tspan fill="#34d399">Prometheus · Grafana</tspan></text>
    <text x="16" y="60" fill="#94a3b8" font-size="10" class="txt-sans">Camo Cache: <tspan fill="#e2e8f0">Automated Invalidate</tspan></text>
    <rect x="16" y="69" width="178" height="12" rx="3" fill="#070b14"/>
    <text x="22" y="78" fill="#10B981" font-size="8" font-weight="bold" class="txt-mono">✔ 100% TELEMETRY PARITY</text>
  </g>
</svg>
