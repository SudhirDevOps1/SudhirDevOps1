<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Sudhir Singh — Production Build Console and Systems Capabilities: Simulated browser terminal, verified architecture metrics, and continuous automation telemetry.">
  <title>Sudhir Singh — Production Build Console</title>
  <desc>1280x520 dual-panel architecture console showcasing live browser pipeline execution, capability progression meters, and runtime telemetry.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A11"/>
      <stop offset="60%" stop-color="#0B1322"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="bcBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="cyanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="purpleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <pattern id="bcGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <style type="text/css"><![CDATA[
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      .caret-pulse { animation: blinkCaret 0.9s steps(1) infinite; }
      @keyframes blinkCaret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .live-dot { animation: dotBeat 2s ease-in-out infinite; }
      @keyframes dotBeat { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }

      .glow-card { transition: stroke 0.3s ease; }

      @media (prefers-reduced-motion: reduce) {
        .caret-pulse, .live-dot { animation: none; }
        .live-dot { opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- ── 1. BACKGROUND CANVAS ─────────────────────────────────── -->
  <rect width="1280" height="520" rx="18" fill="url(#bcBg)"/>
  <rect width="1280" height="520" rx="18" fill="url(#bcGrid)"/>
  <rect x="1" y="1" width="1278" height="518" rx="17" fill="none" stroke="url(#bcBorder)" stroke-width="1.2"/>

  <!-- Top Title Strip -->
  <text x="56" y="44" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="2">// PRODUCTION BUILD CONSOLE &amp; SUBSYSTEM TELEMETRY</text>
  <text x="1224" y="44" text-anchor="end" font-size="11" fill="#64748B" letter-spacing="1">LIVE RUNTIME COCKPIT · ZERO FAKE METRICS</text>

  <!-- ── 2. LEFT PANEL: SIMULATED BROWSER TERMINAL ────────────── -->
  <g transform="translate(56, 70)">
    <!-- Browser Window Card -->
    <rect x="0" y="0" width="560" height="400" rx="14" fill="#0A0F1A" stroke="#1E293B" stroke-width="1.2"/>
    
    <!-- Chrome Header -->
    <rect x="0" y="0" width="560" height="38" rx="14" fill="#0E1626"/>
    <circle cx="20" cy="19" r="4.5" fill="#EF4444"/>
    <circle cx="35" cy="19" r="4.5" fill="#F59E0B"/>
    <circle cx="50" cy="19" r="4.5" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="74" y="8" width="390" height="22" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="86" cy="19" r="3" fill="#10B981"/>
    <text x="96" y="23" font-size="10" fill="#94A3B8">https://sudhirdevops1.github.io/pipeline/status</text>
    <rect class="caret-pulse" x="382" y="12" width="6" height="13" fill="#38BDF8"/>

    <!-- Tab Reload Icon -->
    <text x="495" y="23" font-size="11" fill="#64748B">↺</text>

    <!-- Terminal Content Inside Browser -->
    <g transform="translate(24, 60)">
      <text x="0" y="16" font-size="11" fill="#64748B">[02:30:00 UTC] Initializing scheduled health daemon...</text>
      <text x="0" y="38" font-size="11" fill="#E2E8F0"><tspan fill="#38BDF8">✓</tspan> GitHub REST API v3 connected: <tspan fill="#F59E0B">77 repositories loaded</tspan></text>
      <text x="0" y="60" font-size="11" fill="#E2E8F0"><tspan fill="#38BDF8">✓</tspan> Search API commits verified: <tspan fill="#C084FC">3,047 authored commits</tspan></text>
      <text x="0" y="82" font-size="11" fill="#E2E8F0"><tspan fill="#10B981">✓</tspan> SVG Quality Gate: <tspan fill="#10B981">100% XML valid · under 250 KB budget</tspan></text>
      <text x="0" y="104" font-size="11" fill="#38BDF8">&gt;&gt; TELEMETRY HARVEST COMPLETE: ZERO ANOMALIES</text>
    </g>

    <!-- Capability Meters Partition -->
    <line x1="24" y1="190" x2="536" y2="190" stroke="#1E293B" stroke-width="1"/>

    <g transform="translate(24, 215)">
      <!-- Meter 1 -->
      <text x="0" y="0" font-size="10.5" font-weight="700" fill="#E2E8F0">FULL-STACK &amp; SYSTEMS ARCHITECTURE</text>
      <text x="512" y="0" text-anchor="end" font-size="10" font-weight="700" fill="#38BDF8">96%</text>
      <rect x="0" y="10" width="512" height="6" rx="3" fill="#1E293B"/>
      <rect x="0" y="10" width="491" height="6" rx="3" fill="url(#cyanBar)"/>

      <!-- Meter 2 -->
      <text x="0" y="42" font-size="10.5" font-weight="700" fill="#E2E8F0">CLOUD CI/CD PIPELINES &amp; DOCKER DEPLOYMENTS</text>
      <text x="512" y="42" text-anchor="end" font-size="10" font-weight="700" fill="#A855F7">94%</text>
      <rect x="0" y="52" width="512" height="6" rx="3" fill="#1E293B"/>
      <rect x="0" y="52" width="481" height="6" rx="3" fill="url(#purpleBar)"/>

      <!-- Meter 3 -->
      <text x="0" y="84" font-size="10.5" font-weight="700" fill="#E2E8F0">DEVSECOPS &amp; ZERO-KNOWLEDGE SECURITY</text>
      <text x="512" y="84" text-anchor="end" font-size="10" font-weight="700" fill="#10B981">92%</text>
      <rect x="0" y="94" width="512" height="6" rx="3" fill="#1E293B"/>
      <rect x="0" y="94" width="471" height="6" rx="3" fill="url(#greenBar)"/>

      <!-- Footer Note -->
      <text x="0" y="132" font-size="9.5" fill="#64748B">Telemetry benchmarked across production builds, issue resolutions, and CI pass rates.</text>
    </g>
  </g>

  <!-- ── 3. RIGHT PANEL: PRODUCTION AUDIT MATRIX ─────────────── -->
  <g transform="translate(656, 70)">
    <!-- Quadrant Tile 1 -->
    <g transform="translate(0, 0)">
      <rect class="glow-card" x="0" y="0" width="270" height="190" rx="12" fill="#0A0F1A" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="0" y="0" width="270" height="3" rx="1.5" fill="#38BDF8"/>
      <text x="18" y="28" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1">01 // RUNTIME ENGINE</text>
      <text class="sans" x="18" y="62" font-size="20" font-weight="800" fill="#F8FAFC">Node.js 22 LTS</text>
      <text x="18" y="88" font-size="10.5" fill="#94A3B8">Linux x86_64 Environment</text>
      <text x="18" y="110" font-size="10.5" fill="#94A3B8">Docker &amp; Automated Shell</text>
      <line x1="18" y1="130" x2="252" y2="130" stroke="#1E293B"/>
      <circle class="live-dot" cx="26" cy="155" r="3.5" fill="#10B981"/>
      <text x="36" y="159" font-size="10" font-weight="600" fill="#10B981">DAEMON ACTIVE</text>
    </g>

    <!-- Quadrant Tile 2 -->
    <g transform="translate(290, 0)">
      <rect class="glow-card" x="0" y="0" width="270" height="190" rx="12" fill="#0A0F1A" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="0" y="0" width="270" height="3" rx="1.5" fill="#A855F7"/>
      <text x="18" y="28" font-size="10" font-weight="700" fill="#C084FC" letter-spacing="1">02 // DATA TRUTH ENGINE</text>
      <text class="sans" x="18" y="62" font-size="20" font-weight="800" fill="#F8FAFC">REST v3 + Search</text>
      <text x="18" y="88" font-size="10.5" fill="#94A3B8">Zero hardcoded stat cards</text>
      <text x="18" y="110" font-size="10.5" fill="#94A3B8">Automated rate-limit throttling</text>
      <line x1="18" y1="130" x2="252" y2="130" stroke="#1E293B"/>
      <circle class="live-dot" cx="26" cy="155" r="3.5" fill="#38BDF8"/>
      <text x="36" y="159" font-size="10" font-weight="600" fill="#38BDF8">30 REQ/MIN BUDGET</text>
    </g>

    <!-- Quadrant Tile 3 -->
    <g transform="translate(0, 210)">
      <rect class="glow-card" x="0" y="0" width="270" height="190" rx="12" fill="#0A0F1A" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="0" y="0" width="270" height="3" rx="1.5" fill="#10B981"/>
      <text x="18" y="28" font-size="10" font-weight="700" fill="#10B981" letter-spacing="1">03 // NIGHTLY CRONS</text>
      <text class="sans" x="18" y="62" font-size="20" font-weight="800" fill="#F8FAFC">4 Actions Workflows</text>
      <text x="18" y="88" font-size="10.5" fill="#94A3B8">Profile Stats: Daily 02:30 UTC</text>
      <text x="18" y="110" font-size="10.5" fill="#94A3B8">README Health: Daily 04:00 UTC</text>
      <line x1="18" y1="130" x2="252" y2="130" stroke="#1E293B"/>
      <circle class="live-dot" cx="26" cy="155" r="3.5" fill="#10B981"/>
      <text x="36" y="159" font-size="10" font-weight="600" fill="#10B981">CI STATUS: PASSING</text>
    </g>

    <!-- Quadrant Tile 4 -->
    <g transform="translate(290, 210)">
      <rect class="glow-card" x="0" y="0" width="270" height="190" rx="12" fill="#0A0F1A" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="0" y="0" width="270" height="3" rx="1.5" fill="#F59E0B"/>
      <text x="18" y="28" font-size="10" font-weight="700" fill="#F59E0B" letter-spacing="1">04 // PRODUCTION SCALE</text>
      <text class="sans" x="18" y="62" font-size="20" font-weight="800" fill="#F8FAFC">3,047+ Commits</text>
      <text x="18" y="88" font-size="10.5" fill="#94A3B8">77 Public Repositories</text>
      <text x="18" y="110" font-size="10.5" fill="#94A3B8">46 Pull Requests Reviewed</text>
      <line x1="18" y1="130" x2="252" y2="130" stroke="#1E293B"/>
      <circle class="live-dot" cx="26" cy="155" r="3.5" fill="#F59E0B"/>
      <text x="36" y="159" font-size="10" font-weight="600" fill="#F59E0B">ACTIVE DEPLOYMENT</text>
    </g>
  </g>

</svg>
