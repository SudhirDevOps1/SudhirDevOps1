<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" width="1280" height="190" role="img" aria-label="Connect with Sudhir Singh on GitHub, LinkedIn, Telegram or the portfolio site">
  <title>Connect — pick a channel</title>
  <desc>Four self-hosted channel cards: GitHub, LinkedIn, Telegram and the portfolio site, each with a staggered entrance.</desc>

  <!--
    Design tokens
      surface #0D1117 / #161B22   border #30363D   text #E6EDF3   muted #8B949E
      accent  #36BCF7 cyan  #A855F7 purple  #3FB950 green
    Icons: Simple Icons (CC0 1.0) paths for GitHub / LinkedIn / Telegram, globe drawn here.
    No numbers are hardcoded in this file — live counts stay in the API-driven blocks.
  -->

  <defs>
    <linearGradient id="cpEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity=".9"/>
    </linearGradient>
    <style>
      .card { opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
      .c1 { animation-delay: .05s; }
      .c2 { animation-delay: .17s; }
      .c3 { animation-delay: .29s; }
      .c4 { animation-delay: .41s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #8B949E; letter-spacing: 2.6px; }
      .name  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #E6EDF3; }
      .handle{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #36BCF7; }
      .desc  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #8B949E; }
      .arrow { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #6E7681; }
      @media (prefers-reduced-motion: reduce) {
        .card { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <text class="label" x="16" y="24">// CONNECT</text>
  <text class="label" x="1264" y="24" text-anchor="end" style="letter-spacing:1.6px">PICK A CHANNEL</text>

  <!-- 01 · GitHub -->
  <g class="card c1">
    <rect x="16.5" y="42.5" width="296" height="131" rx="14" fill="#161B22" stroke="#30363D"/>
    <rect x="16.5" y="42.5" width="296" height="3" rx="1.5" fill="#E6EDF3" fill-opacity=".55"/>
    <rect x="36" y="64" width="44" height="44" rx="12" fill="#0D1117" stroke="#30363D"/>
    <g transform="translate(48 76) scale(.8333)" fill="#E6EDF3">
      <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    </g>
    <text class="name" x="94" y="86">GitHub</text>
    <text class="handle" x="94" y="104">@SudhirDevOps1</text>
    <text class="desc" x="36" y="146">All repositories, source code and commit history.</text>
    <text class="arrow" x="290" y="70" text-anchor="end">↗</text>
  </g>

  <!-- 02 · LinkedIn -->
  <g class="card c2">
    <rect x="333.5" y="42.5" width="296" height="131" rx="14" fill="#161B22" stroke="#30363D"/>
    <rect x="333.5" y="42.5" width="296" height="3" rx="1.5" fill="#36BCF7" fill-opacity=".75"/>
    <rect x="353" y="64" width="44" height="44" rx="12" fill="#0D1117" stroke="#30363D"/>
    <g transform="translate(365 76) scale(.8333)" fill="#36BCF7">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
    </g>
    <text class="name" x="411" y="86">LinkedIn</text>
    <text class="handle" x="411" y="104">in/SudhirDevOps1</text>
    <text class="desc" x="353" y="146">Open to internships, full-time roles and freelance.</text>
    <text class="arrow" x="607" y="70" text-anchor="end">↗</text>
  </g>

  <!-- 03 · Telegram -->
  <g class="card c3">
    <rect x="650.5" y="42.5" width="296" height="131" rx="14" fill="#161B22" stroke="#30363D"/>
    <rect x="650.5" y="42.5" width="296" height="3" rx="1.5" fill="#A855F7" fill-opacity=".75"/>
    <rect x="670" y="64" width="44" height="44" rx="12" fill="#0D1117" stroke="#30363D"/>
    <g transform="translate(682 76) scale(.8333)" fill="#A855F7">
      <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
    </g>
    <text class="name" x="728" y="86">Telegram</text>
    <text class="handle" x="728" y="104">@SudhirDevOps1</text>
    <text class="desc" x="670" y="146">The fastest way to reach me for a quick reply.</text>
    <text class="arrow" x="924" y="70" text-anchor="end">↗</text>
  </g>

  <!-- 04 · Portfolio -->
  <g class="card c4">
    <rect x="967.5" y="42.5" width="296" height="131" rx="14" fill="#161B22" stroke="#30363D"/>
    <rect x="967.5" y="42.5" width="296" height="3" rx="1.5" fill="#3FB950" fill-opacity=".75"/>
    <rect x="987" y="64" width="44" height="44" rx="12" fill="#0D1117" stroke="#30363D"/>
    <g transform="translate(999 76)" fill="none" stroke="#3FB950" stroke-width="1.6">
      <circle cx="12" cy="12" r="10"/>
      <ellipse cx="12" cy="12" rx="4.4" ry="10"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
    </g>
    <text class="name" x="1045" y="86">Portfolio</text>
    <text class="handle" x="1045" y="104">sudhirdevops1.github.io</text>
    <text class="desc" x="987" y="146">Live projects, write-ups and the work behind them.</text>
    <text class="arrow" x="1241" y="70" text-anchor="end">↗</text>
  </g>
</svg>
