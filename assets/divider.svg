<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 36" width="1280" height="36" role="img" aria-label="Section divider">
  <title>Section divider</title>
  <desc>Animated gradient rule with a travelling light pulse and a terminal chevron in the middle.</desc>

  <!--
    Design tokens (shared with every self-hosted asset in this folder)
      surface  #0D1117 / #161B22   border #30363D   text #E6EDF3   muted #8B949E
      accent   #36BCF7 cyan        #A855F7 purple  ok #3FB950
      motion   entrance .7s cubic-bezier(.2,.8,.2,1) · loops >= 3s
    Weight budget: <= 15KB per asset. No raster, no embedded fonts, no GIFs.
  -->

  <defs>
    <linearGradient id="dvFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0"/>
      <stop offset=".3" stop-color="#36BCF7" stop-opacity=".72"/>
      <stop offset=".7" stop-color="#A855F7" stop-opacity=".72"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dvPulse" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="170" y2="0">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8ED8FF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sweep { animation: sweep 9s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes sweep {
        0%   { transform: translateX(-170px); opacity: 0; }
        9%   { opacity: 1; }
        91%  { opacity: 1; }
        100% { transform: translateX(1450px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sweep { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <line x1="0" y1="18" x2="556" y2="18" stroke="url(#dvFade)" stroke-width="1.6"/>
  <line x1="724" y1="18" x2="1280" y2="18" stroke="url(#dvFade)" stroke-width="1.6"/>

  <g class="sweep">
    <rect x="0" y="16.2" width="170" height="3.6" rx="1.8" fill="url(#dvPulse)"/>
  </g>

  <rect x="598" y="6" width="84" height="24" rx="12" fill="#161B22" stroke="#3D444D"/>
  <text x="640" y="22.5" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#36BCF7" letter-spacing="1.5">&gt;_</text>
</svg>
