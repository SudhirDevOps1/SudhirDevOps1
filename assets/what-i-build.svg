<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="What I Build — Sudhir Singh Systems Engineering">
  <title>What I Build — Sudhir Singh</title>
  <desc>Three production systems architected by Sudhir Singh: Resilient full-stack applications, autonomous CI/CD pipelines, and high-availability systems architecture.</desc>

  <defs>
    <style type="text/css"><![CDATA[
text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sg { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .sgm { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
      .jb { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .jbb { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 700; }

      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes floatSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes radarSpin { 100% { transform: rotate(360deg); } }

      .fu { animation: fadeUp .7s cubic-bezier(.2,.8,.2,1) both; }
      .fi { animation: fadeIn .7s ease both; }
      .fl { animation: floatSlow 6s ease-in-out infinite; }
      .radar-sweep { transform-box: fill-box; transform-origin: center; animation: radarSpin 8s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    ]]></style>

    <linearGradient id="wpanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E131F"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="cardG1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="cardG2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="cardG3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>

    <pattern id="wdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r=".9" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>

    <clipPath id="wClip">
      <rect width="1280" height="520" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#wClip)">
    <rect width="1280" height="520" fill="url(#wpanel)"/>
    <rect width="1280" height="520" fill="url(#wdots)"/>
    <rect x=".75" y=".75" width="1278.5" height="518.5" rx="23.25" fill="none" stroke="url(#wedge)" stroke-width="1.5"/>

    <!-- Section Header -->
    <g transform="translate(56,54)" class="fu">
      <text class="jbb" font-size="11.5" fill="#38BDF8" letter-spacing="2.2">// OPERATIONAL SCOPE &amp; SUBSYSTEMS</text>
      <text class="sg" y="32" font-size="28" fill="#F1F5F9" letter-spacing="-.4">What I Architect &amp; Ship to Production</text>
    </g>

    <!-- Top Right Verified Live Badge -->
    <g transform="translate(1076,64)">
      <rect x="0" y="-18" width="148" height="28" rx="14" fill="#38BDF8" fill-opacity=".1" stroke="#38BDF8" stroke-opacity=".4"/>
      <circle cx="16" cy="-4" r="4" fill="#38BDF8"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text class="jbb" x="28" y="0" font-size="9.5" fill="#38BDF8" letter-spacing="1.1">VERIFIED ACTIVE</text>
    </g>

    <!-- ── LEFT SIDE: ARCHITECTURE VISUAL CONSOLE (x=56 to x=430) ─── -->
    <g transform="translate(56,120)" class="fl">
      <!-- Browser Frame -->
      <rect width="374" height="356" rx="16" fill="#070A11" stroke="#1E293B"/>
      
      <!-- Frame Top Bar -->
      <rect width="374" height="36" rx="16" fill="#0B1220"/>
      <rect y="20" width="374" height="16" fill="#0B1220"/>
      <circle cx="20" cy="18" r="4.5" fill="#EF4444" fill-opacity=".8"/>
      <circle cx="36" cy="18" r="4.5" fill="#F59E0B" fill-opacity=".8"/>
      <circle cx="52" cy="18" r="4.5" fill="#10B981" fill-opacity=".8"/>
      
      <!-- URL Bar -->
      <rect x="74" y="8" width="220" height="20" rx="6" fill="#070A11" stroke="#1E293B"/>
      <text class="jb" x="84" y="22" font-size="9" fill="#64748B">systems.sudhir.dev/status</text>

      <!-- Center Radar Telemetry Rings -->
      <g transform="translate(187,178)">
        <circle r="90" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4"/>
        <circle r="60" fill="none" stroke="#1E293B" stroke-width="1.5"/>
        <circle r="30" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity=".4"/>
        
        <!-- Rotating Sweep Line -->
        <g class="radar-sweep">
          <line x1="0" y1="0" x2="88" y2="0" stroke="#38BDF8" stroke-width="2"/>
        </g>
        
        <circle r="8" fill="#0B1220" stroke="#38BDF8" stroke-width="2"/>
        <circle r="3" fill="#38BDF8"/>
      </g>

      <!-- Bottom Status Readouts inside visual frame -->
      <g transform="translate(20,296)">
        <rect width="334" height="42" rx="8" fill="#0B1220" stroke="#1E293B"/>
        <circle cx="16" cy="21" r="3.5" fill="#10B981"/>
        <text class="jbb" x="28" y="25" font-size="10" fill="#10B981">&#62; PIPELINE HEALTH: 100% OPERATIONAL</text>
      </g>
    </g>

    <!-- ── RIGHT SIDE: 3 PRODUCTION CAPABILITY ROWS (x=460 to x=1224) ─── -->
    <!-- Row 1: Full-Stack Applications -->
    <g transform="translate(460,120)" class="fu" style="animation-delay:.2s">
      <rect width="764" height="106" rx="14" fill="#0B1220" stroke="#1E293B"/>
      <rect x="18" y="16" width="24" height="3" rx="1.5" fill="#38BDF8"/>
      <text class="jbb" x="50" y="22" font-size="10" fill="#38BDF8" letter-spacing="1.5">01 // RESILIENT FULL-STACK APPLICATIONS</text>
      
      <text class="sg" x="18" y="52" font-size="16" fill="#F1F5F9">Local-First Desktop Cockpits &amp; Web Audio Synthesis</text>
      <text class="sgm" x="18" y="74" font-size="12.5" fill="#94A3B8">High-performance tools: syntax screenshot generator, binaural neuroscience audio engines, and zero-knowledge vaults.</text>
      
      <g transform="translate(18,84)">
        <text class="jb" font-size="10" fill="#64748B">STACK: <tspan class="jbb" fill="#CBD5E1">TypeScript &#183; React/Next.js &#183; Web Audio API &#183; Node.js</tspan></text>
      </g>
    </g>

    <!-- Row 2: Autonomous CI/CD -->
    <g transform="translate(460,244)" class="fu" style="animation-delay:.35s">
      <rect width="764" height="106" rx="14" fill="#0B1220" stroke="#1E293B"/>
      <rect x="18" y="16" width="24" height="3" rx="1.5" fill="#C084FC"/>
      <text class="jbb" x="50" y="22" font-size="10" fill="#C084FC" letter-spacing="1.5">02 // AUTONOMOUS CI/CD &amp; TELEMETRY</text>
      
      <text class="sg" x="18" y="52" font-size="16" fill="#F1F5F9">Scheduled Health Gates &amp; Verified API Engines</text>
      <text class="sgm" x="18" y="74" font-size="12.5" fill="#94A3B8">Automated GitHub Actions pipelines pulling real data via REST v3 and GraphQL, with strict XML quality gating.</text>
      
      <g transform="translate(18,84)">
        <text class="jb" font-size="10" fill="#64748B">STACK: <tspan class="jbb" fill="#CBD5E1">GitHub Actions &#183; Cron &#183; GitHub REST v3 &#183; Search API &#183; Python</tspan></text>
      </g>
    </g>

    <!-- Row 3: Systems & Security -->
    <g transform="translate(460,368)" class="fu" style="animation-delay:.5s">
      <rect width="764" height="106" rx="14" fill="#0B1220" stroke="#1E293B"/>
      <rect x="18" y="16" width="24" height="3" rx="1.5" fill="#10B981"/>
      <text class="jbb" x="50" y="22" font-size="10" fill="#10B981" letter-spacing="1.5">03 // SYSTEMS ARCHITECTURE &amp; AUDIT</text>
      
      <text class="sg" x="18" y="52" font-size="16" fill="#F1F5F9">High-Availability Containers &amp; Zero-Dependency Design</text>
      <text class="sgm" x="18" y="74" font-size="12.5" fill="#94A3B8">Client-side AES-GCM-256 encryption, containerized microservices, and self-hosted vector graphics.</text>
      
      <g transform="translate(18,84)">
        <text class="jb" font-size="10" fill="#64748B">STACK: <tspan class="jbb" fill="#CBD5E1">Docker &#183; Linux Systems &#183; DevSecOps &#183; Clean Architecture</tspan></text>
      </g>
    </g>
  </g>
</svg>
