<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="What Sudhir builds: complete applications, automation that runs itself, and interfaces designed with intent.">
  <title>What I build</title>
  <desc>Three illustrated capability cards: a browser mock for build, a three node workflow for automate, and a palette plus type scale for design.</desc>

  <!-- Tokens: #0B0F17-#121826 bg · #161B22/#0D1117 panel · #30363D border · #36BCF7 · #A855F7 · #3FB950 -->

  <defs>
    <linearGradient id="wbBg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="560">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <pattern id="wbDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity=".045"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .card { opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
      .c2 { animation-delay: .14s; }
      .c3 { animation-delay: .28s; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .blink { animation: on 3.2s ease-in-out infinite; }
      .b2 { animation-delay: 1.1s; }
      .b3 { animation-delay: 2.2s; }
      @keyframes on { 0%, 100% { opacity: 1; } 50% { opacity: .28; } }
      @media (prefers-reduced-motion: reduce) {
        .card, .blink { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1280" height="560" fill="url(#wbBg)"/>
  <rect width="1280" height="560" fill="url(#wbDots)"/>

  <text class="mono" x="56" y="62" font-size="11" fill="#8B949E" letter-spacing="2.6">// WHAT I BUILD</text>
  <text class="mono" x="1224" y="62" text-anchor="end" font-size="10.5" fill="#4B5563" letter-spacing="1.6">SHIPPED · AUTOMATED · DESIGNED</text>

  <!-- ── 01 BUILD ─────────────────────────────────────────────── -->
  <g class="card">
    <rect x="56" y="94" width="370" height="410" rx="18" fill="#121826" stroke="#30363D"/>
    <rect x="56" y="94" width="370" height="3" rx="1.5" fill="#36BCF7" fill-opacity=".85"/>

    <text class="mono" x="88" y="140" font-size="11" fill="#36BCF7" letter-spacing="2">01</text>
    <text class="mono" x="394" y="140" text-anchor="end" font-size="10" fill="#4B5563" letter-spacing="1.4">BUILD</text>

    <rect x="86" y="164" width="310" height="152" rx="10" fill="#0D1117" stroke="#30363D"/>
    <path d="M86 174 a10 10 0 0 1 10-10 h290 a10 10 0 0 1 10 10 v16 h-310 z" fill="#161B22"/>
    <line x1="86" y1="190" x2="396" y2="190" stroke="#30363D"/>
    <circle cx="102" cy="174" r="3.4" fill="#FF5F57"/>
    <circle cx="113" cy="174" r="3.4" fill="#FEBC2E"/>
    <circle cx="124" cy="174" r="3.4" fill="#28C840"/>

    <rect x="102" y="204" width="132" height="11" rx="5.5" fill="#36BCF7" fill-opacity=".55"/>
    <rect x="102" y="226" width="176" height="7" rx="3.5" fill="#8B949E" fill-opacity=".45"/>
    <rect x="102" y="240" width="146" height="7" rx="3.5" fill="#8B949E" fill-opacity=".3"/>
    <rect x="102" y="254" width="160" height="7" rx="3.5" fill="#8B949E" fill-opacity=".3"/>

    <rect x="292" y="204" width="88" height="80" rx="9" fill="#A855F7" fill-opacity=".18" stroke="#A855F7" stroke-opacity=".4"/>
    <circle cx="336" cy="232" r="11" fill="#A855F7" fill-opacity=".55"/>
    <rect x="308" y="252" width="56" height="6" rx="3" fill="#A855F7" fill-opacity=".35"/>
    <rect x="308" y="264" width="40" height="6" rx="3" fill="#A855F7" fill-opacity=".25"/>

    <rect x="102" y="284" width="96" height="18" rx="9" fill="#3FB950" fill-opacity=".45"/>

    <text class="sans" x="88" y="360" font-size="23" font-weight="700" fill="#E6EDF3">Build</text>
    <text class="sans" x="88" y="388" font-size="13" fill="#8B949E">Complete applications, not tutorials.</text>
    <text class="sans" x="88" y="408" font-size="13" fill="#8B949E">React + TypeScript with real API wiring,</text>
    <text class="sans" x="88" y="428" font-size="13" fill="#8B949E">clean state and shipped behaviour.</text>

    <line x1="88" y1="452" x2="394" y2="452" stroke="#1C2128"/>
    <text class="mono" x="88" y="478" font-size="10" fill="#36BCF7" letter-spacing="1.2">repo-backed, not slideware</text>
  </g>

  <!-- ── 02 AUTOMATE ──────────────────────────────────────────── -->
  <g class="card c2">
    <rect x="455" y="94" width="370" height="410" rx="18" fill="#121826" stroke="#30363D"/>
    <rect x="455" y="94" width="370" height="3" rx="1.5" fill="#A855F7" fill-opacity=".85"/>

    <text class="mono" x="487" y="140" font-size="11" fill="#A855F7" letter-spacing="2">02</text>
    <text class="mono" x="793" y="140" text-anchor="end" font-size="10" fill="#4B5563" letter-spacing="1.4">AUTOMATE</text>

    <rect x="485" y="188" width="94" height="48" rx="10" fill="#0D1117" stroke="#30363D"/>
    <text class="mono" x="532" y="217" text-anchor="middle" font-size="10" fill="#36BCF7">cron</text>

    <rect x="603" y="188" width="94" height="48" rx="10" fill="#0D1117" stroke="#30363D"/>
    <text class="mono" x="650" y="217" text-anchor="middle" font-size="10" fill="#A855F7">script</text>

    <rect x="721" y="188" width="94" height="48" rx="10" fill="#0D1117" stroke="#30363D"/>
    <text class="mono" x="768" y="217" text-anchor="middle" font-size="10" fill="#3FB950">commit</text>

    <line x1="579" y1="212" x2="603" y2="212" stroke="#30363D" stroke-width="1.5"/>
    <line x1="697" y1="212" x2="721" y2="212" stroke="#30363D" stroke-width="1.5"/>
    <circle class="blink" cx="591" cy="212" r="3" fill="#36BCF7"/>
    <circle class="blink b2" cx="709" cy="212" r="3" fill="#A855F7"/>

    <path d="M768 236 v26 H532 v-26" fill="none" stroke="#30363D" stroke-width="1.4" stroke-dasharray="5 5"/>
    <circle class="blink b3" cx="650" cy="262" r="3" fill="#3FB950"/>
    <text class="mono" x="650" y="284" text-anchor="middle" font-size="9.5" fill="#4B5563">every 24h, unattended</text>

    <text class="sans" x="487" y="360" font-size="23" font-weight="700" fill="#E6EDF3">Automate</text>
    <text class="sans" x="487" y="388" font-size="13" fill="#8B949E">If a task repeats three times it becomes</text>
    <text class="sans" x="487" y="408" font-size="13" fill="#8B949E">a script. This profile commits itself</text>
    <text class="sans" x="487" y="428" font-size="13" fill="#8B949E">every morning without being asked.</text>

    <line x1="487" y1="452" x2="793" y2="452" stroke="#1C2128"/>
    <text class="mono" x="487" y="478" font-size="10" fill="#A855F7" letter-spacing="1.2">runs while I sleep</text>
  </g>

  <!-- ── 03 DESIGN ────────────────────────────────────────────── -->
  <g class="card c3">
    <rect x="854" y="94" width="370" height="410" rx="18" fill="#121826" stroke="#30363D"/>
    <rect x="854" y="94" width="370" height="3" rx="1.5" fill="#3FB950" fill-opacity=".85"/>

    <text class="mono" x="886" y="140" font-size="11" fill="#3FB950" letter-spacing="2">03</text>
    <text class="mono" x="1192" y="140" text-anchor="end" font-size="10" fill="#4B5563" letter-spacing="1.4">DESIGN</text>

    <rect x="886" y="170" width="44" height="44" rx="10" fill="#36BCF7"/>
    <rect x="940" y="170" width="44" height="44" rx="10" fill="#A855F7"/>
    <rect x="994" y="170" width="44" height="44" rx="10" fill="#3FB950"/>
    <rect x="1048" y="170" width="44" height="44" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="1102" y="170" width="44" height="44" rx="10" fill="#E6EDF3"/>

    <rect x="886" y="240" width="156" height="15" rx="5" fill="#E6EDF3" fill-opacity=".82"/>
    <rect x="886" y="264" width="118" height="10" rx="5" fill="#8B949E" fill-opacity=".55"/>
    <rect x="886" y="282" width="86" height="8" rx="4" fill="#8B949E" fill-opacity=".35"/>

    <circle cx="1146" cy="266" r="30" fill="#0D1117" stroke="#30363D"/>
    <text class="sans" x="1146" y="275" text-anchor="middle" font-size="22" font-weight="700" fill="#E6EDF3">Aa</text>

    <text class="sans" x="886" y="360" font-size="23" font-weight="700" fill="#E6EDF3">Design</text>
    <text class="sans" x="886" y="388" font-size="13" fill="#8B949E">Dark surfaces, accessible contrast,</text>
    <text class="sans" x="886" y="408" font-size="13" fill="#8B949E">tight spacing and motion with intent.</text>
    <text class="sans" x="886" y="428" font-size="13" fill="#8B949E">Tokens first, pixels second.</text>

    <line x1="886" y1="452" x2="1192" y2="452" stroke="#1C2128"/>
    <text class="mono" x="886" y="478" font-size="10" fill="#3FB950" letter-spacing="1.2">token-driven, contrast-checked</text>
  </g>

  <text class="mono" x="640" y="540" text-anchor="middle" font-size="10" fill="#4B5563" letter-spacing=".6">every claim above points at a repository you can open right now</text>
</svg>
