<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Tech arsenal: sixteen tools across frontend, backend, and DevOps, each drawn as a consistent geometric glyph in its brand colour.">
  <title>Tech arsenal</title>
  <desc>A sixteen tile board of the tools used day to day, drawn with one geometric glyph language instead of pasted brand logos.</desc>

  <!-- Tokens: #0B0F17-#121826 bg · #161B22/#0D1117 panel · #30363D border · #36BCF7 · #A855F7 · #3FB950 -->

  <defs>
    <linearGradient id="saBg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="520">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tile { opacity: 0; animation: pop .5s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .n { font-size: 11px; font-weight: 600; fill: #C9D1D9; }
      .s { font-size: 9px; fill: #4B5563; letter-spacing: .6px; }
      @media (prefers-reduced-motion: reduce) { .tile { animation: none; opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="520" fill="url(#saBg)"/>

  <text class="mono" x="56" y="60" font-size="11" fill="#8B949E" letter-spacing="2.6">// TECH ARSENAL</text>
  <text class="mono" x="1224" y="60" text-anchor="end" font-size="10.5" fill="#4B5563" letter-spacing="1.6">16 TOOLS I ACTUALLY WORK IN</text>

