name: Update Profile Stats

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: refresh README numbers and the streak card from the GitHub API
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Recompute every stat from the live API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/update-stats.mjs

      - name: Redraw the streak card from the live contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/update-streak.mjs

      - name: Commit refreshed README
        run: |
          if [ -z "$(git status --porcelain README.md assets/streak-buddy.svg)" ]; then
            echo "No changes to commit — stats and streak card already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/streak-buddy.svg
          git commit -m "chore(stats): refresh live GitHub stats + streak card"
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt $attempt"
              pushed=1
              break
            fi
            echo "push attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Could not push refreshed stats after 3 attempts"
            exit 1
          fi
