name: Update Profile Stats

on:
  schedule:
    - cron: "15 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: refresh README numbers and the generated cards from the GitHub API
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recompute every stat from the live API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/update-stats.mjs

      - name: Redraw the streak card from the live contribution calendar
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/update-streak.mjs

      - name: Verify all SVG assets, links, and data parity
        run: node scripts/verify-all.mjs

      - name: Commit refreshed README and cards
        run: |
          if [ -z "$(git status --porcelain README.md assets/)" ]; then
            echo "No changes to commit — profile stats and cards are already current."
            exit 0
          fi
          git config user.name "Sudhir Singh"
          git config user.email "234449571+SudhirDevOps1@users.noreply.github.com"
          git add README.md assets/
          git commit -m "chore(stats): daily profile telemetry sync [skip ci]"
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt $attempt"
              pushed=1
              break
            fi
            echo "push attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Could not push refreshed stats after 3 attempts"
            exit 1
          fi
